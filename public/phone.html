<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Millirons Detailing — Phone preview</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;gap:40px;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif;color:#1d1d1f}
.phone{width:390px;height:844px;border-radius:58px;background:#000;padding:14px;box-shadow:0 30px 80px rgba(0,0,0,.25),inset 0 0 0 2px #333;position:relative}
.island{position:absolute;top:24px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:2}
iframe{width:100%;height:100%;border:0;border-radius:46px;background:#fff}
.side{max-width:280px}.side h1{font-size:32px;letter-spacing:-.03em;margin:0 0 10px}.side p{color:#6e6e73;line-height:1.5}.side a{color:#000;font-weight:600}
@media(max-height:900px){.phone{transform:scale(.88)}}</style></head>
<body><div class="phone"><div class="island"></div><iframe src="/" title="Millirons Detailing mobile" allow="camera"></iframe></div>
<div class="side"><h1>Phone preview</h1><p>390 × 844 (iPhone 14/15 size). Click through like a phone. Sample logins are on the Sign in page.</p><p><a href="/">Open full site ›</a></p><p><small>Camera VIN scan works inside this frame on localhost if you allow camera access.</small></p></div></body></html>
