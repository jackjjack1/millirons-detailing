# Fail a pull request when AGENT_NOTES.md was not changed, or when the
# description has no Summary section or no testing section. Print the rules
# and post the same reminder on the pull request.
name: rules-check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  rules-check:
    name: rules-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Print the rules and check the pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/rules-check.mjs
